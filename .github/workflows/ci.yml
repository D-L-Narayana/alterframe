name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to major.minor so the version is deterministic. Must satisfy the INSTALLED engine
  # ranges: vite 8 (^20.19.0 || >=22.12.0) and eslint 10 (^20.19.0 || ^22.13.0 || >=24).
  # tests/unit/infra/ci.test.ts fails if this drifts out of range. A bare "20" would resolve to
  # 20.x releases that Vite 8 rejects on some runners, so it is not used.
  NODE_VERSION: '22.23'
  CI: 'true'

jobs:
  check:
    name: typecheck · lint · unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install (runs postinstall → copy MediaPipe wasm into public/wasm)
        run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests (incl. repo hygiene + infra; the GPU suite skips here — it runs in the e2e job with Chromium)
        run: npm test -- --reporter=default --reporter=junit --outputFile=test-results/unit-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: test-results/unit-junit.xml
          if-no-files-found: ignore

  build:
    name: build · verify dist payload · bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache MediaPipe models (fetched by prebuild, not committed)
        uses: actions/cache@v4
        with:
          path: public/models/*.task public/models/*.tflite
          key: mediapipe-models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: npm ci
      - name: Build (prebuild fetches models + copies wasm; postbuild verifies dist/models + dist/wasm)
        run: npm run build
      - name: Bundle size report (total JS ≤ 450 kB gz; entry chunk ≤ 128 kB gz and MediaPipe-free — blocking)
        run: node scripts/bundle-report.mjs --strict
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: playwright (chromium, fake camera, mock tracking) · GPU pixel tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        with:
          path: public/models/*.task public/models/*.tflite
          key: mediapipe-models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - name: Cache the synthetic fixture clips (generated, ~135 MB, gitignored)
        uses: actions/cache@v4
        with:
          path: tests/fixtures/*.y4m
          key: fixture-y4m-${{ hashFiles('tests/fixtures/make-fixture.mjs') }}
      - run: npm ci
      - run: npm run fetch-models
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: GPU pixel tests (real WebGL2 through SwiftShader; long hook timeout for the harness boot)
        run: npx vitest run tests/unit/render-core/gpu.test.ts --hookTimeout 300000 --testTimeout 120000
      - name: Generate synthetic fixture video (no-op when the cache restored it)
        run: npm run fixture -- --if-missing
      - name: Run e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  prod-gate:
    name: production gate (serve-dist · vercel.json headers · CSP violations · no dev hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache the synthetic fixture clips (the gate drives the fake camera)
        uses: actions/cache@v4
        with:
          path: tests/fixtures/*.y4m
          key: fixture-y4m-${{ hashFiles('tests/fixtures/make-fixture.mjs') }}
      - run: npm ci
      - name: Download the production build (models + wasm included)
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate synthetic fixture video (no-op when the cache restored it)
        run: npm run fixture -- --if-missing
      - name: Serve dist with the vercel.json semantics and run the gate (E2E_PROD_URL exported by with-server)
        run: node scripts/with-server.mjs --port 4173 -- npm run test:prod-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-gate-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  audit:
    name: npm audit (advisory, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit runtime dependencies (high and above)
        run: npm audit --omit=dev --audit-level=high
