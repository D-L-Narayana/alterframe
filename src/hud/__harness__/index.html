<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>W8 HUD harness — AlterFrame</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #0b0b0d; color: #f2f2f4; font: 14px/1.4 Inter, system-ui, sans-serif; }
      header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,.08); }
      header label { display: inline-flex; gap: 6px; align-items: center; }
      main { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 16px; padding: 16px; }
      figure { margin: 0; }
      figcaption { color: #9a9aa3; margin: 6px 0 0; font-size: 12px; }
      canvas.stage { width: 100%; aspect-ratio: 16 / 9; display: block; background: #222; border-radius: 10px; }
      kbd { background: #141418; border: 1px solid rgba(255,255,255,.12); border-radius: 4px; padding: 0 4px; }
    </style>
  </head>
  <body>
    <header>
      <strong>W8 HUD harness</strong>
      <label><input type="checkbox" id="animate" checked /> animate (t)</label>
      <label><input type="checkbox" id="reduced" /> reduced motion</label>
      <label><input type="checkbox" id="recording" checked /> recording</label>
      <label><input type="checkbox" id="fps" checked /> fps badge</label>
      <label><input type="checkbox" id="debug" /> debug landmarks</label>
      <label>opacity <input type="range" id="opacity" min="0" max="1" step="0.01" value="1" /></label>
      <label>font <select id="font"><option value="">Inter stack (default)</option><option value="system-ui, sans-serif">system-ui fallback</option><option value="serif">serif (worst case)</option></select></label>
      <span id="status"></span>
    </header>
    <main id="root"></main>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
