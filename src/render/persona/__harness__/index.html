<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AlterFrame — persona layer harness (W6)</title>
  <style>
    body { margin: 0; background: #0b0b0d; color: #f2f2f4; font: 14px/1.4 system-ui, sans-serif; }
    header { display: flex; gap: 12px; align-items: center; padding: 10px 14px; flex-wrap: wrap; }
    header label { display: inline-flex; gap: 6px; align-items: center; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 14px 14px; }
    canvas { width: 100%; height: auto; background: #222; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; }
    h2 { font-size: 12px; font-weight: 400; color: #9a9aa3; margin: 4px 0; }
    button, select { background: #141418; color: inherit; border: 1px solid rgba(255,255,255,.15); border-radius: 8px; padding: 6px 10px; min-height: 32px; }
  </style>
</head>
<body>
  <header>
    <strong>Persona layer harness</strong>
    <label>Persona <select id="persona"><option>portrait</option><option>masked</option><option>suit</option></select></label>
    <label><input type="checkbox" id="animate" checked /> animate roll</label>
    <label><input type="checkbox" id="blink" checked /> blink</label>
    <label><input type="checkbox" id="reduced" /> reduced motion</label>
    <label><input type="checkbox" id="landmarks" /> show landmarks</label>
    <label>Roll <input type="range" id="roll" min="-40" max="40" value="0" /> <span id="rollv">0°</span></label>
    <label>Overlay strength <input type="range" id="strength" min="0" max="100" value="100" /> <span id="strengthv">1.00</span></label>
    <label><input type="checkbox" id="headx" checked /> head x drift</label>
    <label>Head x <input type="range" id="facex" min="20" max="80" value="50" /> <span id="facexv">0.50</span></label>
    <span id="stats"></span>
  </header>
  <main>
    <section><h2>Composite (synthetic person + backdrop behind + overlay)</h2><canvas id="composite" width="1280" height="720"></canvas></section>
    <section><h2>Overlay only (RGBA on checker)</h2><canvas id="overlayView" width="1280" height="720"></canvas></section>
    <section><h2>Backdrop only</h2><canvas id="backdropView" width="1280" height="720"></canvas></section>
    <section><h2>Synthetic "video" (no overlay)</h2><canvas id="videoView" width="1280" height="720"></canvas></section>
  </main>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
