<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlterFrame — W3 tracking harness</title>
    <style>
      body { margin: 0; background: #0b0b0d; color: #f2f2f4; font: 14px/1.4 system-ui, sans-serif; }
      header { display: flex; gap: 12px; align-items: center; padding: 10px 14px; flex-wrap: wrap; }
      button, select, label { font: inherit; }
      button { background: #141418; color: inherit; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 14px 14px; }
      .pane { position: relative; background: #141418; border-radius: 10px; overflow: hidden; aspect-ratio: 16/9; }
      .pane > * { position: absolute; inset: 0; width: 100%; height: 100%; }
      video { object-fit: contain; }
      pre { grid-column: 1 / -1; margin: 0; padding: 10px 14px; background: #141418; border-radius: 10px; white-space: pre-wrap; font-size: 12px; }
      progress { width: 220px; }
      .muted { color: #9a9aa3; }
    </style>
  </head>
  <body>
    <header>
      <strong>W3 tracking harness</strong>
      <button id="btn-camera">Use camera</button>
      <label>Still image <input id="file-image" type="file" accept="image/*" /></label>
      <button id="btn-synthetic">Synthetic input</button>
      <label>Delegate <select id="delegate"><option>GPU</option><option>CPU</option></select></label>
      <label><input type="checkbox" id="mirror" checked /> mirrored</label>
      <label>seg stride <input type="number" id="stride" min="1" max="6" value="1" style="width:3em" /></label>
      <progress id="progress" max="1" value="0"></progress>
      <span id="status" class="muted">idle</span>
    </header>
    <main>
      <div class="pane"><video id="video" muted playsinline></video><canvas id="overlay"></canvas></div>
      <div class="pane"><canvas id="mask"></canvas></div>
      <pre id="log"></pre>
    </main>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
